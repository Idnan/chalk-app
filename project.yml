name: Chalk
options:
  bundleIdPrefix: com.idnan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: BHB942LSYW
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Chalk:
    type: application
    platform: macOS
    sources:
      - path: Chalk
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Chalk/Info.plist
      properties:
        CFBundleDisplayName: Chalk
        CFBundleName: Chalk
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Adnan Ahmed"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idnan.chalk
        PRODUCT_NAME: Chalk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
  ChalkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ChalkTests
    dependencies:
      - target: Chalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idnan.chalk.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Chalk:
    build:
      targets:
        Chalk: all
        ChalkTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChalkTests
